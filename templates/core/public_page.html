{% extends 'base.html' %}
{% block title %}{{ page.title }} · DonoFlow{% endblock %}
{% block content %}
<article class="cms-page {% if page.slug == 'come-funziona' or page.slug == 'info' %}cms-page-fullwidth{% endif %}">
  <header class="page-hero {% if page.slug == 'come-funziona' or page.slug == 'info' %}cms-page-fullwidth-hero{% endif %}">
    <div class="page-hero-mark" aria-hidden="true"><span></span></div>
    <p class="eyebrow">DonoFlow</p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="lead">{{ page.summary }}</p>{% endif %}
  </header>
  <div class="prose {% if page.slug == 'come-funziona' or page.slug == 'info' %}cms-page-fullwidth-content{% endif %}">
    {{ page.content|safe }}
  </div>
</article>
{% endblock %}
